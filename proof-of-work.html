<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proof of Work — Design Showcase | Skoll Digital</title>
  <meta name="description" content="An interactive design workspace demonstrating our creative pipeline, plan architecture, and color-matching methodologies.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Proof of Work — Design Showcase | Skoll Digital">
  <meta property="og:description" content="Explore how we construct campaigns, craft color moodboards, and execute creative brand directions.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/images/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/global.css">
  <style>
    body { background: #0A0A0A; margin: 0; }
    #skoll-preloader { position: fixed; inset: 0; background: #0B132A; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
    #skoll-preloader.skoll-preloader-out { pointer-events: none; }
    .skoll-preloader-word { font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(3rem, 10vw, 5rem); font-weight: 800; letter-spacing: -0.03em; color: #FAFAFA; }
    .skoll-preloader-word span { display: inline-block; opacity: 0; transform: translateY(0.5em); }
    .skoll-preloader-bar-wrap { width: 200px; height: 2px; background: rgba(240, 238, 233,0.1); border-radius: 2px; overflow: hidden; }
    .skoll-preloader-bar { height: 100%; width: 0; background: #C9A84C; border-radius: 2px; transition: width 0.2s ease-out; }
    #skoll-scroll-progress { position: fixed; top: 0; left: 0; height: 2px; background: #C9A84C; z-index: 99998; width: 0%; transform-origin: left; }
  </style>
</head>
<body>
  <div id="skoll-scroll-progress" aria-hidden="true"></div>
  <div id="skoll-preloader">
    <div id="preloader-matrix-canvas" style="position: absolute; inset: 0; opacity: 0.12; pointer-events: none; font-family: monospace; font-size: 11px; color: #C9A84C; overflow: hidden; line-height: 1.2; word-break: break-all; white-space: pre-wrap; user-select: none;"></div>
    <div class="skoll-preloader-word" id="skoll-preloader-word" style="position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 16px;">
      <div id="preloader-terminal" style="font-family: monospace; font-size: 0.75rem; letter-spacing: 0.25em; color: #C9A84C; text-transform: uppercase; opacity: 0.8; height: 16px;">[SECURE DECRYPT BOOT]</div>
      <h2 id="preloader-scrambler" style="font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: clamp(1.25rem, 4vw, 1.75rem); letter-spacing: 0.4em; text-transform: uppercase; color: #FAFAFA; margin: 0; min-height: 30px; text-align: center;">PROOF OF WORK</h2>
    </div>
    <div class="skoll-preloader-bar-wrap" style="position: relative; z-index: 2; margin-top: 12px;">
      <div class="skoll-preloader-bar" id="skoll-preloader-bar"></div>
    </div>
  </div>
  <script>
    (function() {
      // 1. Matrix rain simulation
      var canvas = document.getElementById('preloader-matrix-canvas');
      if (canvas) {
        var chars = '01010101XYZSKOLLSYSTEMBLUEPRINTCORE';
        var cols = Math.floor(window.innerWidth / 5.5);
        var rows = Math.floor(window.innerHeight / 10);
        
        var matrixInterval = setInterval(function() {
          var text = '';
          for (var r = 0; r < rows; r++) {
            var line = '';
            for (var c = 0; c < cols; c++) {
              if (Math.random() > 0.96) {
                line += chars[Math.floor(Math.random() * chars.length)];
              } else {
                line += Math.random() > 0.5 ? ' ' : '0';
              }
            }
            text += line + '\n';
          }
          canvas.textContent = text;
        }, 80);
        window.addEventListener('resize', function() {
          cols = Math.floor(window.innerWidth / 5.5);
          rows = Math.floor(window.innerHeight / 10);
        });
      }

      // 2. Character text scrambler
      var scrambler = document.getElementById('preloader-scrambler');
      var terminal = document.getElementById('preloader-terminal');
      if (scrambler) {
        scrambler.textContent = "PROOF OF WORK";
        setTimeout(function() {
          if (terminal) terminal.textContent = "[DECRYPTION SECURE]";
          if (matrixInterval) {
            setTimeout(function() { clearInterval(matrixInterval); }, 500);
          }
        }, 1200);
      }
    })();
  </script>
  <main id="skoll-main">
    <div id="navbar-container"></div>
    <div id="proof-of-work-container"></div>
    <div id="footer-container"></div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
  <script>
    window.SKOLL_SECTIONS = [
      { id: 'navbar-container', path: 'sections/navbar.html' },
      { id: 'proof-of-work-container', path: 'sections/proof-of-work.html' },
      { id: 'footer-container', path: 'sections/footer.html' }
    ];
  </script>
  <script src="assets/js/page-loader.js"></script>
  <script src="assets/js/cursor.js"></script>
  <script src="assets/js/animations.js"></script>
</body>
</html>
